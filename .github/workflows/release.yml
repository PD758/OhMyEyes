name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Verify release tag
        shell: pwsh
        run: .\scripts\check-release-version.ps1
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build portable archive
        shell: pwsh
        run: .\scripts\package.ps1 -SkipBuild
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build NSIS installer
        run: cargo packager --release --formats nsis
      - name: Collect installer
        shell: pwsh
        run: Copy-Item -Path target\release\*setup.exe -Destination dist -Force
      - name: Write checksums
        shell: pwsh
        run: .\scripts\write-checksums.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OhMyEyes-windows-x64
          path: dist/**
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/**
          generate_release_notes: true
